<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom stacks · Stacks</title>
  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="manager.css">
  <script type="module" src="src/manager.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 5v5h-5M4 19v-5h5M19 10a7.5 7.5 0 0 0-13-4M5 14a7.5 7.5 0 0 0 13 4"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a1 1 0 0 1 1-1h5l3 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-organize" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
  </defs></svg>
  <header class="brand">
    <div class="wordmark"><img src="icons/48.png" alt="" width="27" height="27"><span>stacks</span></div>
    <button id="new-stack" class="primary" aria-label="New custom stack"><svg class="icon"><use href="#i-plus"/></svg>New stack</button>
  </header>
  <main>
    <h1 id="heading" class="sr-only">All tabs</h1>
    <div class="view-row">
      <div class="view-picker"><svg class="icon folder"><use href="#i-folder"/></svg><select id="category-filter" aria-label="View stack"><option value="all">All tabs</option></select><svg class="icon chevron"><use href="#i-chevron"/></svg></div>
      <button id="edit-stack" class="text-button" hidden>Edit stack</button>
      <button id="organize-window" class="icon-button" aria-label="Organize websites" title="Organize tabs by website"><svg class="icon"><use href="#i-organize"/></svg></button>
    </div>
    <div class="tools">
      <div class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search your tabs" aria-label="Search tabs"><button id="clear-search" class="icon-button" aria-label="Clear search" hidden><svg class="icon"><use href="#i-close"/></svg></button></div>
      <button id="refresh" class="icon-button" aria-label="Refresh" title="Refresh tabs"><svg class="icon"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="list-heading"><label><input id="select-all" type="checkbox"><span>Select all</span></label><span id="tab-count"></span></div>
    <div id="tabs" class="tabs" aria-label="Tabs"></div>
    <div id="empty" class="empty-state"><svg class="empty-icon icon"><use href="#i-folder"/></svg><strong id="empty-title">Loading your tabs…</strong><p id="empty-description">Your open pages stay in Chrome.</p><button id="empty-action" hidden>Show all tabs</button></div>
  </main>
  <footer class="selection-bar">
    <div class="selection-summary"><span id="selection-count" role="status">Select tabs to move</span><button id="release" class="text-button" hidden>Return to automatic</button><button id="clear-selection" class="icon-button" aria-label="Clear selection" title="Clear selection" hidden><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div class="move-row"><div class="destination-picker"><select id="destination" aria-label="Destination stack" disabled><option value="">Move to a stack…</option></select><svg class="icon chevron"><use href="#i-chevron"/></svg></div><button id="move" class="primary" disabled>Move tabs</button></div>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="selection-help" class="footnote">Custom stacks stay out of automatic grouping.</p>
  </footer>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="stack-form">
      <div class="dialog-heading"><h2 id="dialog-title">New custom stack</h2><button id="cancel" type="button" class="icon-button" aria-label="Cancel"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <p class="dialog-hint">A name and color for tabs that belong together.</p>
      <label class="field">Name<input id="stack-name" placeholder="e.g. Literature review" maxlength="80" required autocomplete="off"></label>
      <fieldset><legend>Color <span id="color-name">Green</span></legend><div id="colors"></div></fieldset>
      <label id="include-label" class="include"><input id="include-selected" type="checkbox" checked><span id="include-text">Include selected tabs</span></label>
      <p class="dialog-note">Tabs in this stack won't be grouped by website.</p>
      <p id="dialog-status" role="alert"></p>
      <div class="dialog-actions"><button id="delete-stack" type="button" class="danger" hidden>Delete empty stack</button><button type="submit" id="save-stack" class="primary">Save stack</button></div>
    </form>
  </dialog>
</body>
</html>
