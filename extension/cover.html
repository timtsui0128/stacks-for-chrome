<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stacks</title>
  <link id="site-icon" rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="cover.css">
  <script src="src/cover.js" type="module"></script>
</head>
<body>
  <main aria-live="polite">
    <img id="site-mark" alt="" width="32" height="32" src="icons/32.png">

  </main>
